name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Build the project
      - name: Build
        run: ./mvnw compile -B

      # 4. Run all tests (unit + integration via Testcontainers)
      - name: Run Tests
        run: ./mvnw test -B

      # 5. Upload JaCoCo coverage report as an artifact
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # 6. Build Docker image (verify Dockerfile works)
      - name: Build Docker Image
        run: docker build -t rate-limiter-gateway:${{ github.sha }} .