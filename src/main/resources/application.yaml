server:
  port: 8080

spring:
  application:
    name: rate-limiter-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: test-route
              uri: https://httpbin.org
              predicates:
                - Path=/test/**
              filters:
                - RewritePath=/test/(?<segment>.*), /${segment}

app:
  rate-limit:
    window-ms: 60000
    tiers:
      FREE: 60
      PRO: 500
      ENTERPRISE: 5000

management:
  endpoints:
    web:
      exposure:
        include: health, info


jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-this-before-production-9f4a7c2e8b1d6f3a}